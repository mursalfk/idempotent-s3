# samconfig.toml
# Set your own credentials before deploying: export AWS_PROFILE=<your-deploy-profile>
version = 0.1

[default.deploy.parameters]
stack_name = "idempotent-s3"
resolve_s3 = true
s3_prefix = "idempotent-s3"
region = "eu-west-3"
confirm_changeset = true
capabilities = "CAPABILITY_IAM"
parameter_overrides = "HandlerMode=\"robust\" FailOnce=\"true\""
image_repositories = []

[default.global.parameters]
region = "eu-west-3"