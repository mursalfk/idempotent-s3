[project]
name = "idempotent-s3"
version = "0.1.0"
description = "Why an S3-triggered Lambda double-charges under retry, and the three idempotency patterns that fix it (or do not)."
requires-python = ">=3.10"
dependencies = ["boto3>=1.34.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["local", "pipeline"]
